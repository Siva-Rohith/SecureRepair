<!DOCTYPE html>
<html>
<head>
    <title>Book Repair - SecureRepair</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="logo">SecureRepair</div>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/book">Book</a></li>
        </ul>
    </nav>

    <section class="services">
        <h2>Book a Repair</h2>

        <form method="POST">
            <input type="text" name="name" placeholder="Your Name" required><br><br>
            <input type="text" name="device" placeholder="Device Model" required><br><br>
            <textarea name="issue" placeholder="Describe the issue" required></textarea><br><br>
            <button type="submit">Submit</button>
        </form>
    </section>

</body>
</html>
