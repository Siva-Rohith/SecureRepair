
<!DOCTYPE html>

<html>
<head>

<title>Chat - SecureRepair</title>

<style>

.chat-page{
font-family: Arial;
background:#f3f4f6;
margin:0;
}

.chat-page .navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
background:white;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.chat-page .chat-container{
max-width:900px;
margin:auto;
margin-top:30px;
background:white;
border-radius:12px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
display:flex;
flex-direction:column;
height:70vh;
}

.chat-header{
padding:15px;
border-bottom:1px solid #eee;
}

.chat-messages{
flex:1;
padding:20px;
overflow-y:auto;
}

.message{
padding:10px 14px;
border-radius:10px;
margin-bottom:10px;
max-width:60%;
}

.user{
background:#2563eb;
color:white;
margin-left:auto;
}

.admin{
background:#e5e7eb;
}

.chat-input{
display:flex;
border-top:1px solid #eee;
}

.chat-input input{
flex:1;
padding:12px;
border:none;
outline:none;
}

.chat-input button{
background:#2563eb;
color:white;
border:none;
padding:12px 20px;
cursor:pointer;
}


.chat-container{
display:flex;
flex-direction:column;
gap:10px;
padding:15px;
}

.chat-msg{
display:flex;
flex-direction:column;
max-width:55%;
padding:8px 12px;
border-radius:12px;
font-size:14px;
word-wrap:break-word;
position:relative;
}

/* USER SIDE (RIGHT) */
.chat-msg.right{
align-self:flex-end;
background:#dcf8c6;
color:#000;
margin-left:auto;
}

/* OTHER SIDE (LEFT) */
.chat-msg.left{
align-self:flex-start;
background:#ffffff;
color:#000;
border:1px solid #ddd;
margin-right:auto;
}
#messages{
height:400px;
overflow-y:auto;
background:#efeae2;
padding:15px;
border-radius:10px;
display:flex;
flex-direction:column;
gap:8px;
}



.msg-text{
display:block;
}

.msg-time{
font-size:11px;
color:#555;
margin-top:4px;
align-self:flex-end;
}

.typing-indicator{
font-size:13px;
color:#555;
padding:6px 12px;
font-style:italic;
position:absolute;
bottom:60px;
left:30px;
display:none;
background:#ffffff;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.chat-container{
position:relative;
}
</style>

</head>

<body class="chat-page">
    <div class="navbar">
<div>SecureRepair Chat</div>

<div>
<a href="/user-chats">Back to Chats</a>
</div>

</div>

<div class="chat-container">

<div class="chat-header">

<b>Service ID:</b> {{ booking.id }} <br> <b>Device:</b> {{ booking.device }} <br> <b>Issue:</b> {{ booking.issue }}

</div>

<div id="messages" class="chat-messages">
</div>
<div id="typingIndicator" class="typing-indicator">
technician is typing...
</div>
<div class="chat-input">

<input type="text" id="messageInput" placeholder="Type message...">

<button onclick="sendMessage()">Send</button>

</div>

</div>

<script>

const bookingId = "{{ booking.id }}";

function loadMessages(){

fetch("/get-messages/" + bookingId)

.then(res => res.json())

.then(data => {

const container = document.getElementById("messages");

container.innerHTML="";

let currentUser = "admin";

data.forEach(msg => {

    const div = document.createElement("div");

    if(msg.sender === currentUser){
        div.className = "chat-msg right";
    }else{
        div.className = "chat-msg left";
    }

    div.innerHTML = `
    <span class="msg-text">${msg.message}</span>
    <span class="msg-time">${msg.created_at.slice(11,16)}</span>
`;

    container.appendChild(div);

});

container.scrollTop = container.scrollHeight;

});

fetch("/check-typing/" + bookingId)
.then(res=>res.json())
.then(data=>{
    const indicator = document.getElementById("typingIndicator");

    if(data.typing){
        indicator.style.display="block";
    }else{
        indicator.style.display="none";
    }
});
}

function sendMessage(){

const input = document.getElementById("messageInput");

const message = input.value.trim();

if(!message) return;

const formData = new FormData();

formData.append("booking_id", bookingId);
formData.append("message", message);

fetch("/send-message",{

method:"POST",

body:formData

})

.then(res=>res.json())

.then(data=>{

if(data.success){

input.value="";

loadMessages();

}

});



}

document.getElementById("messageInput").addEventListener("keypress", function(e){

    if(e.key === "Enter"){
        e.preventDefault();   // prevents page reload
        sendMessage();
    }

});
loadMessages();

setInterval(loadMessages,2000);



let typingTimeout;

document.getElementById("messageInput").addEventListener("input", function(){

clearTimeout(typingTimeout);

fetch("/typing", {
method:"POST",
body:new URLSearchParams({booking_id: bookingId})
});

typingTimeout = setTimeout(()=>{},1000);

});
</script>



</body>
</html>
